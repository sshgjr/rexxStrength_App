name: rexx_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  cupertino_icons: ^1.0.8

  # 영상 선택
  image_picker: ^1.1.2

  # ML Kit 포즈 감지
  google_mlkit_pose_detection: ^0.12.0

  # 프레임 추출 (video_thumbnail) + 영상 미리보기 (video_player)
  video_thumbnail: ^0.5.3
  video_player: ^2.9.2

  # 네트워크 상태 확인
  connectivity_plus: ^6.1.0

  # 오프라인 결과 캐시
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
